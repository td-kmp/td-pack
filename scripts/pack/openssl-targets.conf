## OpenSSL Configure targets missing upstream (used via --config).
my %targets = (
    # Windows on ARM with a MinGW (llvm-mingw) toolchain: mingw64 minus its
    # x86-only -m64; td-pack builds MinGW OpenSSL with no-asm anyway.
    "tdpack-mingw-arm64" => {
        inherit_from     => [ "mingw64" ],
        cflags           => "",
        asm_arch         => undef,
        perlasm_scheme   => undef,
    },
);
